name: Ferry monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      always_notify:
        description: "Надіслати звіт навіть якщо змін немає"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ferry-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROUTE_FROM: ATH
          ROUTE_TO: CYP
          DATES: "2026-08-20,2026-08-24,2026-08-27"
          WATCH: pax,cabin
          ALWAYS_NOTIFY: ${{ inputs.always_notify }}
        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "ferry-monitor"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
